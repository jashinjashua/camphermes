name: Build and deploy

# Pages on this repo is in legacy mode, serving the main branch root, and
# changing that source needs repo admin. So deployment works by committing
# the built site into the branch root: PRs only build and test, pushes to
# main also publish the dist output as a [skip ci] commit that Pages serves.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish dist to the branch root
        if: github.event_name != 'pull_request'
        run: |
          rm -rf _astro about rank hero img og index.html .nojekyll CNAME
          cp -r dist/. .
          rm -rf dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "deploy: publish built site [skip ci]"
          git pull --rebase origin main
          git push
